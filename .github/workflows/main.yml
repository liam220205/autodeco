
name: Build Auto Decorator AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Geode Mod
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          build-config: Release

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: AutoDecoratorAI
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
